# Môi trường phát triển cục bộ: CSDL + dịch vụ B1. Token phát triển: python tools/dev_token.py (xem README).
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: b1
      POSTGRES_PASSWORD: b1
      POSTGRES_DB: b1
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b1"]
      interval: 2s
      retries: 30
  api:
    build: .
    environment:
      B1_DATABASE_URL: postgresql+psycopg://b1:b1@db:5432/b1
      B1_JWKS_FILE: /dev-keys/jwks.json
    volumes: ["./.dev:/dev-keys:ro"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
