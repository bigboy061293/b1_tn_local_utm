# Cổng vào telemetry I-07 (CT-6): TLS 1.3, chứng chỉ khách do hành lang cấp (xác thực hai chiều), chỉ mở một cổng.
# Cổng vào gắn kết quả TLS vào tiêu đề cho B1 đọc; xoá tiêu đề cùng tên do khách tự gửi.
# Bản sao số chạy bằng: docker run --network host -v $PWD/config/ingress:/etc/nginx/conf.d:ro -v <thư mục chứng chỉ>:/certs:ro nginx:1.25
server {
    listen 8443 ssl;
    ssl_certificate      /certs/server.pem;
    ssl_certificate_key  /certs/server.key;
    ssl_protocols        TLSv1.3;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client    on;
    client_max_body_size 1m;

    location ~ ^/(telemetry/v1|v1/ct-sessions)/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-B1-TLS-Version $ssl_protocol;
        proxy_set_header X-B1-Client-Verify $ssl_client_verify;
        proxy_set_header X-B1-Client-Subject $ssl_client_s_dn;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}
